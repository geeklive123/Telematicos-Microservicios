name: telematicos-academico

x-app-environment: &app-environment
  APP_ENV: local
  APP_DEBUG: "false"
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  DB_PORT: "3306"
  DB_USERNAME: ${MYSQL_USER:?Configura MYSQL_USER}
  DB_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD}
  CACHE_STORE: database
  SESSION_DRIVER: database
  QUEUE_CONNECTION: sync

x-rabbit-environment: &rabbit-environment
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: ${RABBITMQ_USER:?Configura RABBITMQ_USER}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Configura RABBITMQ_PASSWORD}
  RABBITMQ_VHOST: /
  RABBITMQ_EXCHANGE: tienda.events
  RABBITMQ_QUEUE: notificaciones.pedidos
  RABBITMQ_ROUTING_KEY: pedido.creado

x-http-health: &http-health
  test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/api/health') === false ? 1 : 0);"]
  interval: 15s
  timeout: 5s
  retries: 6
  start_period: 30s

x-db: &db
  image: mysql:8.4
  restart: unless-stopped
  networks: [telematicos-network]
  healthcheck:
    test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
    interval: 10s
    timeout: 5s
    retries: 15
    start_period: 40s

services:
  auth-service:
    build: ./auth-service
    image: telematicos-auth:local
    restart: unless-stopped
    networks: [telematicos-network]
    ports: ["127.0.0.1:8000:80"]
    environment:
      <<: *app-environment
      APP_KEY: ${AUTH_APP_KEY:?Configura AUTH_APP_KEY}
      APP_URL: http://auth-service
      DB_HOST: auth-db
      DB_DATABASE: auth_db
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET}
    depends_on:
      auth-db:
        condition: service_healthy
    healthcheck: *http-health

  productos-service:
    build: ./productos-service
    image: telematicos-productos:local
    restart: unless-stopped
    networks: [telematicos-network]
    ports: ["127.0.0.1:8001:80"]
    environment:
      <<: *app-environment
      APP_KEY: ${PRODUCTOS_APP_KEY:?Configura PRODUCTOS_APP_KEY}
      APP_URL: http://productos-service
      DB_HOST: productos-db
      DB_DATABASE: productos_db
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET}
    depends_on:
      productos-db:
        condition: service_healthy
    healthcheck: *http-health

  clientes-service:
    build: ./clientes-service
    image: telematicos-clientes:local
    restart: unless-stopped
    networks: [telematicos-network]
    ports: ["127.0.0.1:8002:80"]
    environment:
      <<: *app-environment
      APP_KEY: ${CLIENTES_APP_KEY:?Configura CLIENTES_APP_KEY}
      APP_URL: http://clientes-service
      DB_HOST: clientes-db
      DB_DATABASE: clientes_db
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET}
    depends_on:
      clientes-db:
        condition: service_healthy
    healthcheck: *http-health

  pedidos-service:
    build: ./pedidos-service
    image: telematicos-pedidos:local
    restart: unless-stopped
    networks: [telematicos-network]
    ports: ["127.0.0.1:8003:80"]
    environment:
      <<: [*app-environment, *rabbit-environment]
      PRODUCTOS_SERVICE_URL: http://productos-service
      CLIENTES_SERVICE_URL: http://clientes-service
      APP_KEY: ${PEDIDOS_APP_KEY:?Configura PEDIDOS_APP_KEY}
      APP_URL: http://pedidos-service
      DB_HOST: pedidos-db
      DB_DATABASE: pedidos_db
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET}
    depends_on:
      pedidos-db:
        condition: service_healthy
      productos-service:
        condition: service_healthy
      clientes-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck: *http-health

  notificaciones-service:
    build: ./notificaciones-service
    image: telematicos-notificaciones:local
    restart: unless-stopped
    networks: [telematicos-network]
    ports: ["127.0.0.1:8004:80"]
    environment:
      <<: *app-environment
      APP_KEY: ${NOTIFICACIONES_APP_KEY:?Configura NOTIFICACIONES_APP_KEY}
      APP_URL: http://notificaciones-service
      DB_HOST: notificaciones-db
      DB_DATABASE: notificaciones_db
    depends_on:
      notificaciones-db:
        condition: service_healthy
    healthcheck: *http-health

  notificaciones-worker:
    image: telematicos-notificaciones:local
    restart: unless-stopped
    command: ["php", "artisan", "rabbitmq:consume"]
    networks: [telematicos-network]
    environment:
      <<: [*app-environment, *rabbit-environment]
      APP_KEY: ${NOTIFICACIONES_APP_KEY:?Configura NOTIFICACIONES_APP_KEY}
      DB_HOST: notificaciones-db
      DB_DATABASE: notificaciones_db
    depends_on:
      notificaciones-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  auth-db:
    <<: *db
    environment:
      MYSQL_DATABASE: auth_db
      MYSQL_USER: ${MYSQL_USER:?Configura MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD}
    volumes:
      - auth-db-data:/var/lib/mysql

  productos-db:
    <<: *db
    environment:
      MYSQL_DATABASE: productos_db
      MYSQL_USER: ${MYSQL_USER:?Configura MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD}
    volumes:
      - productos-db-data:/var/lib/mysql

  clientes-db:
    <<: *db
    environment:
      MYSQL_DATABASE: clientes_db
      MYSQL_USER: ${MYSQL_USER:?Configura MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD}
    volumes:
      - clientes-db-data:/var/lib/mysql

  pedidos-db:
    <<: *db
    environment:
      MYSQL_DATABASE: pedidos_db
      MYSQL_USER: ${MYSQL_USER:?Configura MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD}
    volumes:
      - pedidos-db-data:/var/lib/mysql

  notificaciones-db:
    <<: *db
    environment:
      MYSQL_DATABASE: notificaciones_db
      MYSQL_USER: ${MYSQL_USER:?Configura MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD}
    volumes:
      - notificaciones-db-data:/var/lib/mysql

  rabbitmq:
    image: rabbitmq:management
    restart: unless-stopped
    networks: [telematicos-network]
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Configura RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Configura RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

networks:
  telematicos-network:
    name: telematicos-network

volumes:
  auth-db-data:
  productos-db-data:
  clientes-db-data:
  pedidos-db-data:
  notificaciones-db-data:
  rabbitmq-data:
